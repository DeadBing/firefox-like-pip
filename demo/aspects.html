<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PiP aspect-ratio fixtures</title>
    <style>
      body {
        font: 16px/1.5 system-ui, sans-serif;
        margin: 32px auto;
        max-width: 1100px;
      }
      .grid {
        display: grid;
        gap: 28px;
        grid-template-columns: 1fr 1fr;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-weight: 600;
        margin-bottom: 8px;
      }
      video {
        background: #000;
        display: block;
        width: 100%;
      }
      .portrait {
        max-width: 220px;
      }
      .note {
        color: #444;
        max-width: 70ch;
      }
    </style>
  </head>
  <body>
    <h1>PiP aspect-ratio fixtures</h1>
    <p class="note">
      Each clip is a live canvas with corner labels (TL / TR / BL / BR). In a correct PiP window
      every label stays visible and the picture fills the viewport without extra bars. Hover a
      video and use the Picture-in-Picture toggle, or press Ctrl+Shift+].
    </p>
    <div class="grid">
      <figure>
        <figcaption>16:9 landscape</figcaption>
        <video id="v169" autoplay muted playsinline></video>
      </figure>
      <figure>
        <figcaption>9:16 portrait</figcaption>
        <video id="v916" class="portrait" autoplay muted playsinline></video>
      </figure>
      <figure>
        <figcaption>4:3 standard</figcaption>
        <video id="v43" autoplay muted playsinline></video>
      </figure>
      <figure>
        <figcaption>21:9 ultrawide</figcaption>
        <video id="v219" autoplay muted playsinline></video>
      </figure>
    </div>
    <script>
      function paintAspectVideo(video, width, height, label, color) {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        const inset = Math.max(10, Math.round(Math.min(width, height) / 40));
        const font = Math.round(Math.min(width, height) / 11);

        const draw = () => {
          ctx.fillStyle = color;
          ctx.fillRect(0, 0, width, height);
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = Math.max(6, Math.round(inset / 2));
          ctx.strokeRect(inset, inset, width - inset * 2, height - inset * 2);
          ctx.fillStyle = "#fff";
          ctx.font = `700 ${font}px system-ui, sans-serif`;
          ctx.textAlign = "left";
          ctx.textBaseline = "top";
          ctx.fillText("TL", inset * 2, inset * 2);
          ctx.textAlign = "right";
          ctx.fillText("TR", width - inset * 2, inset * 2);
          ctx.textAlign = "left";
          ctx.textBaseline = "bottom";
          ctx.fillText("BL", inset * 2, height - inset * 2);
          ctx.textAlign = "right";
          ctx.fillText("BR", width - inset * 2, height - inset * 2);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(label, width / 2, height / 2);
          requestAnimationFrame(draw);
        };

        video.srcObject = canvas.captureStream(30);
        video.play().catch(() => {});
        requestAnimationFrame(draw);
      }

      paintAspectVideo(document.getElementById("v169"), 1280, 720, "16:9", "#1d4ed8");
      paintAspectVideo(document.getElementById("v916"), 720, 1280, "9:16", "#b45309");
      paintAspectVideo(document.getElementById("v43"), 800, 600, "4:3", "#15803d");
      paintAspectVideo(document.getElementById("v219"), 1680, 720, "21:9", "#6d28d9");
    </script>
  </body>
</html>
