<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Picture-in-Picture</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="intro" class="intro"></p>
      <form id="form">
        <label class="row">
          <input type="checkbox" name="toggleEnabled" />
          <span data-i18n="toggleEnabled"></span>
        </label>
        <label class="row">
          <input type="checkbox" name="alwaysShowToggle" />
          <span data-i18n="alwaysShowToggle"></span>
        </label>
        <label class="row stack">
          <span data-i18n="minVideoSecs"></span>
          <input type="number" name="minVideoSecs" min="0" max="3600" step="1" />
        </label>
        <label class="row">
          <input type="checkbox" name="respectDisablePictureInPicture" />
          <span data-i18n="respectDisable"></span>
        </label>
        <label class="row">
          <input type="checkbox" name="autoPipOnTabSwitch" />
          <span data-i18n="autoPip"></span>
        </label>
        <label class="row">
          <input type="checkbox" name="keyboardControlsEnabled" />
          <span data-i18n="keyboardControls"></span>
        </label>
        <label class="row">
          <input type="checkbox" name="captionsEnabled" />
          <span data-i18n="captionsEnabled"></span>
        </label>
        <label class="row stack">
          <span data-i18n="captionFontSize"></span>
          <select name="captionFontSize">
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>
        </label>
        <label class="row">
          <input type="checkbox" name="pauseOnClose" />
          <span data-i18n="pauseOnClose"></span>
        </label>
        <label class="row">
          <input type="checkbox" name="showPlaceholder" />
          <span data-i18n="showPlaceholder"></span>
        </label>
      </form>
      <p id="saved" class="saved" hidden></p>
      <section>
        <h2 id="shortcuts-heading"></h2>
        <p id="shortcut-toggle"></p>
        <p id="shortcut-player"></p>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
